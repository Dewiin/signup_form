<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>
<body>
    <!-- Background -->
    <div id="hero">
        <video autoplay muted loop id="backgroundVideo">
            <source src="bgVideo.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Main -->
    <div id="main">
        <div class="content">
            <div class="title">
                <p class="header"><span style="font-size: 1.5em;">6</span> TRAI<span style="font-size: 1.5em;">N</span></p>
            </div>
            <form class="forms" action="#" method="#">
                <div class="form_input">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" minlength="3" required>
                </div>
                <div class="form_input">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" minlength="3" required>
                </div>
                <div class="form_input">
                    <label for="confirmPassword">Re-enter:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" minlength="3" required>
                </div>
                <div class="form_input">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <button id="submit" type="submit">Sign Up</button>
            </div>
        </div>
    </div>

</body>
</html>
